name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            python3-gi python3-dbus gir1.2-gtk-4.0 shellcheck xvfb \
            desktop-file-utils
      - name: Run checks
        run: ./scripts/check.sh
