name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-gi python3-dbus gir1.2-gtk-4.0 shellcheck

      - name: Verify the tag matches VERSION
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          file_version="$(tr -d '[:space:]' < VERSION)"
          if [[ "${tag_version}" != "${file_version}" ]]; then
            printf 'Tag %s does not match VERSION %s\n' \
              "${GITHUB_REF_NAME}" "${file_version}" >&2
            exit 1
          fi

      - name: Run checks
        run: ./scripts/check.sh

      - name: Build the release archive
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          name="freeze-watch-${version}"
          mkdir -p "dist/${name}"
          cp -r \
            assets docs packaging scripts src systemd tests \
            install.sh uninstall.sh \
            CHANGELOG.md LICENSE README.md README.zh-TW.md VERSION \
            "dist/${name}/"
          tar -czf "dist/${name}.tar.gz" -C dist "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")

      - name: Extract the changelog section
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          awk -v want="## ${version} " '
            index($0, want) == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > dist/notes.md
          if [[ ! -s dist/notes.md ]]; then
            printf 'CHANGELOG.md has no section for %s\n' "${version}" >&2
            exit 1
          fi

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          gh release create "${GITHUB_REF_NAME}" \
            --title "Freeze Watch ${version}" \
            --notes-file dist/notes.md \
            "dist/freeze-watch-${version}.tar.gz" \
            "dist/freeze-watch-${version}.tar.gz.sha256"
